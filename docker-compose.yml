version: "3.8"

services:
  # Dedicated PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opticas_postgres_vector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opticas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opticas_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-opticas_db}
    volumes:
      - opticas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opticas_user} -d ${POSTGRES_DB:-opticas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chilean Optics Scraper & AI REST API
  opticas-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opticas_chile_scraper
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8008}:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dB57RDrRgEPNO6VK9AGUZoNwWANPBlrGgTOqk1D28OUqy5OhetekKsqfKDDAdoHoB7BowKMniCR4Guoiqxd2uNJyiKPyXKMS4AtgmC87FbzyJmPGeG7wJDFiRfwZp6Gj}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - ENABLE_SECURITY_HEADERS=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-opticas_user}:${POSTGRES_PASSWORD:-opticas_pass_123}@postgres:5432/${POSTGRES_DB:-opticas_db}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://192.168.1.85:11434}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-qwen2.5:1.5b}
      - AUTO_SCRAPE_INTERVAL_HOURS=12
      - SCRAPER_TIMEOUT_SECONDS=30
      - SCRAPER_MAX_CONCURRENCY=5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - opticas_app_data:/app/data

  # Astro + React + shadcn/ui Frontend (Served on Port 3001)
  opticas-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opticas_chile_frontend
    restart: unless-stopped
    depends_on:
      - opticas-api
    ports:
      - "${FRONTEND_PORT:-3002}:3001"
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://192.168.1.85:8008}
      - PUBLIC_API_KEY=${API_KEY:-dB57RDrRgEPNO6VK9AGUZoNwWANPBlrGgTOqk1D28OUqy5OhetekKsqfKDDAdoHoB7BowKMniCR4Guoiqxd2uNJyiKPyXKMS4AtgmC87FbzyJmPGeG7wJDFiRfwZp6Gj}

volumes:
  opticas_postgres_data:
    name: opticas_postgres_data
  opticas_app_data:
    name: opticas_app_data